{% extends "base.html" %}

{% block title %}Eliminar artículo - Blog de Ingeniería{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-10 px-4 sm:px-6 lg:px-8">
    <div class="bg-white shadow rounded-lg p-6">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Eliminar artículo</h2>
        
        <p class="text-gray-600 mb-6">¿Estás seguro de que quieres eliminar "{{ object.title }}"? Esta acción no se puede deshacer.</p>
        
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 text-white py-2 px-4 rounded hover:bg-red-700">Sí, eliminar</button>
            <a href="{% url 'articles:detail' slug=object.slug %}" class="bg-gray-200 text-gray-700 py-2 px-4 rounded hover:bg-gray-300">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
